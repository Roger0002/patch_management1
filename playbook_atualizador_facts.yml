---
- name: Atualiza os facts forçadamente
  hosts: localhost
  gather_facts: false
  vars:
    usuario: admin
    senha: redhat
  tasks:
    - name: Coleta o status
      ansible.builtin.uri:
        url: https://controller.lab5.example.com/api/v2/settings/jobs/
        method: GET
        force_basic_auth: true
        url_username: "{{ usuario }}"
        url_password: "{{ senha }}"
        validate_certs: false
      register: estado_atual_cache_fact

    - name: Mostra
      ansible.builtin.debug:
        var: estado_atual_cache_fact

    - name: Executa o Job Template que atualiza os facts
      ansible.controller.job_launch:
        controller_host: https://controller.lab5.example.com
        controller_username: "{{ usuario }}"
        controller_password: "{{ senha }}"
        job_template: Coleta de facts do parque
        wait: true
      register: job
      when: false

    - name: Muda o valor de ANSIBLE_FACT_CACHE_TIMEOUT
      ansible.controller.settings:
        controller_host: https://controller.lab5.example.com
        controller_username: "{{ usuario }}"
        controller_password: "{{ senha }}"
        name: ANSIBLE_FACT_CACHE_TIMEOUT
        value: 10
      register: testing_settings
      when: false

...
